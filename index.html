<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="gorjeta.js" defer></script>
    <title>Calculadora de Gorjeta</title>

  </head>
  <body>
    <main oninput ="gorjeta()">

      <h1>Calculadora de Gorjeta</h1>

      <section>
        <div class="bill">
          <label for="yourBill">Conta:</label>
          <input 
            type="number" 
            placeholder="Valor da conta." 
            id="suaConta" />
        </div>

        <div>
          <div class="space-between">
            <label for="">Selecione a gorjeta.</label
            ><span id="porcentagemGorjeta">0%</span>
          </div>
          <input type="range" value="0" id="campoGorjeta" class="range" />
        </div>

        <div class="space-between">
          <span>Gorjeta:</span>
          <span id="valorGorjeta"></span>
        </div>

        <hr />

        <div class="space-between total">
          <span>Total:</span>
          <span id="totalComGorjeta"></span>
        </div>

      </section>

      <section>
        <div>
          <div class="space-between">
            <label for="campoPessoas">Pessoa</label>
            <span id="quantidadePessoas">1</span>
          </div>
          <input
            type="range"
            min="1"
            max="10"
            value="1"
            id="divisaoPessoas"
            class="range"
          />
        </div>

        <div class="space-between">
          <span>Valor por pessoa:</span>
          <span id="cadaPessoa"></span>
        </div>

        <div class="space-between">
          <span>Gorjeta por pessoa:</span>
          <span id="gorjetaPessoa"></span>
        </div>

      </section>
    </main>
  </body>
</html>
